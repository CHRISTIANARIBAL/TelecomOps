
{% extends "admin/base_site.html" %}

{% block title %}Generate Invoice | {{ site_title }}{% endblock %}

{% block content %}
<div id="content-main">

    <h1>Generate Customer Invoice</h1>

    <p>
        Select a customer subscription and provide the billing
        information below.
    </p>

    <form method="post">
        {% csrf_token %}

        <fieldset class="module aligned">
            {{ form.as_p }}
        </fieldset>

        <div class="submit-row">
            <input
                type="submit"
                value="Generate Invoice"
                class="default"
            >

            <a href="{% url 'admin:billing_invoice_changelist' %}"
               class="closelink">
                Cancel
            </a>
        </div>
    </form>

</div>
{% endblock %}
