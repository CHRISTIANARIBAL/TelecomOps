
{% extends "admin/base_site.html" %}

{% block title %}Record Payment | {{ site_title }}{% endblock %}

{% block content %}

<div id="content-main">

    <h1>Record Customer Payment</h1>

    <p>
        Record a customer payment and apply it to an invoice.
    </p>

    <form method="post">
        {% csrf_token %}

        <fieldset class="module aligned">
            {{ form.as_p }}
        </fieldset>

        <div class="submit-row">

            <input
                type="submit"
                value="Save Payment"
                class="default"
            >

            <a
                href="{% url 'admin:billing_payment_changelist' %}"
                class="closelink"
            >
                Cancel
            </a>

        </div>
    </form>

</div>

{% endblock %}
