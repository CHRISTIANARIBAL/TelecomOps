{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Recovery Code | TelecomOps</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-[#080d19] text-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-md bg-[#0c1424] border border-slate-800 rounded-2xl p-8">

        <div class="h-12 w-12 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl mb-7">
            T
        </div>

        <p class="text-blue-400 text-sm font-semibold mb-3">
            EMAIL VERIFICATION
        </p>

        <h1 class="text-3xl font-bold">Enter your code</h1>

        <p class="text-slate-400 text-sm mt-3 leading-6">
            Enter the six-digit recovery code sent to your registered email address.
        </p>

        {% for message in messages %}
            <div class="mt-5 p-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-300 text-sm">
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST" class="mt-7 space-y-5">
            {% csrf_token %}

            <input
                type="text"
                name="code"
                required
                maxlength="6"
                minlength="6"
                inputmode="numeric"
                pattern="[0-9]{6}"
                autocomplete="one-time-code"
                placeholder="000000"
                value="{{ entered_code|default:'' }}"
                class="w-full text-center text-3xl tracking-[0.5em] font-bold px-4 py-4 rounded-xl bg-[#111b2d] border border-slate-800 outline-none focus:border-blue-500"
            >

            <button
                type="submit"
                class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold transition">
                Verify Code
            </button>
        </form>

        <form method="POST" action="{% url 'resend_password_reset_otp' %}" class="mt-5">
            {% csrf_token %}
            <button type="submit"
                class="w-full text-sm text-blue-400 hover:text-blue-300">
                Resend Recovery Code
            </button>
        </form>

        <a href="{% url 'forgot_password' %}"
           class="block text-center text-sm text-slate-400 hover:text-blue-400 mt-6">
            Start Again
        </a>

    </main>
</body>
</html>
