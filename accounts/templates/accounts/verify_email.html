{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | TelecomOps</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-[#080d19] text-white
    flex items-center justify-center p-5">

    <div class="w-full max-w-md bg-[#0c1424]
        border border-slate-800 rounded-2xl p-8">

        <div class="w-14 h-14 rounded-xl bg-blue-600/15
            border border-blue-500/20 flex items-center
            justify-center text-blue-400 mx-auto">
            <svg class="w-7 h-7" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-center mt-6">
            Verify your email
        </h1>

        <p class="text-sm text-slate-400 text-center mt-3">
            We've sent a six-digit verification code to
            <span class="text-blue-400">{{ user.email }}</span>.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="mt-5 p-3 rounded-lg bg-blue-500/10
                    text-blue-300 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="mt-7 space-y-5">
            {% csrf_token %}

            <label class="block text-sm font-medium">
                Verification code
            </label>

            <input
                type="text"
                name="code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                autocomplete="one-time-code"
                required
                autofocus
                placeholder="000000"
                value="{{ entered_code|default:'' }}"
                class="w-full text-center text-2xl tracking-[0.5em]
                rounded-xl bg-[#111b2d] border border-slate-700
                py-4 outline-none focus:border-blue-500"
            >

            <button type="submit"
                class="w-full py-3.5 rounded-xl bg-blue-600
                hover:bg-blue-500 font-semibold">
                Verify Email
            </button>
        </form>

        <form method="POST" action="{% url 'resend_registration_otp' %}"
            class="mt-4">
            {% csrf_token %}

            <button type="submit"
                class="w-full text-sm text-blue-400 hover:text-blue-300">
                Resend verification code
            </button>
        </form>

        <p class="text-xs text-slate-600 text-center mt-7">
            Your verification code expires after 15 minutes.
        </p>

    </div>

</body>
</html>
